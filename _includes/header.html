<header class="site-header">
  <div class="container">
    <div class="site-header__brand">
      <a class="site-title" href="/">
        <span>{{ site.title }}</span>
      </a>
      {% if site.tagline %}
        <span class="site-tagline">// {{ site.tagline }}</span>
      {% endif %}
    </div>
    <nav class="site-nav" aria-label="Main navigation">
      {% unless page.url == "/" %}
        <a href="/" class="site-nav__home" aria-label="Return to the Interactive Menu">
          <span class="site-nav__arrow" aria-hidden="true">&larr;</span> Interface
        </a>
      {% endunless %}
      {% if site.author.email %}
        <a href="mailto:{{ site.author.email }}" title="{{ site.author.email }}">Email</a>
      {% endif %}
    </nav>
  </div>
</header>

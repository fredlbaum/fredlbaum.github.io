---
layout: page
---
{{ content }}

{% if form_url %}
  <div class="guestbook-frame">
    <iframe src="{{ form_url }}?embedded=true"
            title="{{ title }} form"
            width="100%"
            height="1000"
            loading="lazy">Loading&hellip;</iframe>
  </div>

  <p class="guestbook-fallback">Form not loading? <a href="{{ form_url }}" target="_blank" rel="noopener">Open the guest book in a new tab</a>.</p>
{% endif %}

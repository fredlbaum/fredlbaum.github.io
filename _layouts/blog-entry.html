---
layout: default
body_class: blog-screen
---
<div class="content-area">
  <div class="container">
    <article class="prose-card">
      <header>
        <h1>{{ title }}</h1>
        <div class="post-meta">
          <time datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date_formatted }}
          </time>
          {% if author %} &middot; {{ author }}{% endif %}
        </div>
      </header>
      <div class="post-body">
        {{ content }}
      </div>
      <p class="project-back"><a href="/blog/">&larr; All Blog Posts</a></p>
    </article>
  </div>
</div>
